<style>
:root{--bg:#eaf0f7;--surface:#fff;--fg:#1a2332;--muted:#5a6b82;--line:#dde3ec;

*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;overflow:hidden}
#map{position:absolute;inset:0;z-index:1;background:#223}
.topbar{position:absolute;top:env(safe-area-inset-top,0);left:0;right:0;z-index:600;

padding:10px max(12px,env(safe-area-inset-left,0)) 22px max(12px,env(safe-area-inset-right,0));pointer-events:none}
.topbar>*{pointer-events:auto}
.trow{display:flex;align-items:center;gap:9px}
.logo{width:30px;height:30px;border-radius:8px;background:#fff;color:#1f3d7a;font-weight:800;font-size:11px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.ttl{min-width:0;flex:1}.ttl h1{margin:0;font-size:14.5px;font-weight:700;color:#fff;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl p{margin:1px 0 0;font-size:10.5px;color:#c9d7f0}
.prog{background:rgba(255,255,255,.16);color:#fff;font-size:11px;font-weight:700;border-radius:20px;padding:5px 11px;white-space:nowrap;flex:0 0 auto;font-variant-numeric:tabular-nums}
.searchrow{position:relative;margin-top:9px}
.searchrow input{width:100%;border:none;border-radius:10px;padding:10px 38px 10px 36px;font-size:14px;background:var(--surface);color:var(--fg);box-shadow:0 2px 8px var(--shadow)}
.searchrow .ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px}
.searchrow .clr{position:absolute;right:7px;top:50%;transform:translateY(-50%);border:none;background:var(--chip);color:var(--muted);width:24px;height:24px;border-radius:50%;font-size:14px;cursor:pointer}
.results{margin-top:7px;background:var(--surface);border-radius:12px;box-shadow:0 6px 20px var(--shadow);max-height:46vh;overflow-y:auto}
.ritem{display:flex;align-items:center;gap:10px;padding:11px 13px;border-bottom:1px solid var(--line);cursor:pointer}
.ritem:last-child{border-bottom:none}
.rdot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}.rdot.ok{background:var(--ok)}.rdot.pend{background:var(--pending)}
.rtext{min-width:0;flex:1}.rtext .a{font-size:13.5px;font-weight:600;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rtext .o{font-size:11.5px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rnum{font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 6px;flex:0 0 auto}
.fabs{position:absolute;right:max(12px,env(safe-area-inset-right,0));z-index:500;bottom:calc(env(safe-area-inset-bottom,0) + 18px);display:flex;flex-direction:column;gap:9px;align-items:flex-end}
.fab{width:46px;height:46px;border-radius:12px;border:none;background:var(--surface);color:var(--accent);box-shadow:0 2px 10px var(--shadow);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.fab.on{background:var(--accent);color:#fff}
.hereBtn{background:var(--accent);color:#fff;font-size:13px;font-weight:700;width:auto;padding:0 16px;height:46px;border-radius:12px;border:none;box-shadow:0 2px 10px var(--shadow);cursor:pointer}
.legend{position:absolute;left:max(12px,env(safe-area-inset-left,0));z-index:500;bottom:calc(env(safe-area-inset-bottom,0) + 18px);

.sheet{position:absolute;left:0;right:0;bottom:0;z-index:700;background:var(--surface);border-radius:18px 18px 0 0;box-shadow:0 -4px 24px var(--shadow);

.sheet.show{transform:translateY(0)}

.sh-head{display:flex;align-items:flex-start;gap:11px;padding-top:4px}
.sh-num{min-width:38px;height:38px;padding:0 8px;border-radius:10px;background:var(--accent);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.sh-ti{min-width:0;flex:1}.sh-ti h2{margin:0;font-size:16px;font-weight:700;line-height:1.25}.sh-ti .sec{font-size:12px;color:var(--muted);margin-top:2px}
.sh-x{border:none;background:var(--chip);color:var(--muted);width:30px;height:30px;border-radius:50%;font-size:16px;cursor:pointer;flex:0 0 auto}
.kv{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}.kv .k{background:var(--chip);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--muted)}.kv .k b{color:var(--fg);font-weight:600}

.acts{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}

.btn.go{background:var(--ok);color:#fff}.btn.sec{background:var(--chip);color:var(--fg)}
.note{font-size:11.5px;color:var(--muted);margin:10px 0 2px;line-height:1.5}
.toast{position:fixed;left:50%;transform:translateX(-50%);z-index:900;bottom:calc(env(safe-area-inset-bottom,0) + 28px);background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:24px;font-size:13px;font-weight:600;box-shadow:0 4px 16px var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s;max-width:86%;text-align:center}
.toast.show{opacity:1}

.pinlbl{background:none;border:none}

.leaflet-container{background:#223}

const street=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {maxZoom:19,attribution:'&copy; OpenStreetMap contributors'});
let satOn=true;
function setSat(on){satOn=on;if(on){street.remove();sat.addTo(map);labels.addTo(map);$('#layerBtn').classList.add('on');}else{sat.remove();labels.remove();street.addTo(map);$('#layerBtn').classList.remove('on');}}
setSat(true);
$('#layerBtn').onclick=()=>setSat(!satOn);

// Polygons + markers
const pomap={},mkmap={};
DATA.forEach(d=>{
 if(d.poly&&d.poly.length>=3){
  const pg=L.polygon(d.poly,{color:okCol,weight:1.6,fillColor:okCol,fillOpacity:0.18}).addTo(map);
  pg.on('click',()=>openSheet(d.n));pomap[d.n]=pg;
 }
 const prec=!d.approx;
 const ic=L.divIcon({className:'pinlbl',html:'<span style="background:'+(prec?okCol:pendCol)+'"><b>'+d.n+'</b></span>',iconSize:[22,22],iconAnchor:[11,22]});
 const mk=L.marker([d.lat,d.lng],{icon:ic}).addTo(map);
 mk.on('click',()=>openSheet(d.n));mkmap[d.n]=mk;
});
function fitAll(){const b=L.latLngBounds(DATA.map(d=>[d.lat,d.lng]));map.fitBounds(b,{padding:[40,40]});}
fitAll();$('#fitBtn').onclick=fitAll;

function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
let meMarker=null;
function pip(lat,lng,poly){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const yi=poly[i][0],xi=poly[i][1],yj=poly[j][0],xj=poly[j][1];if(((yi>lat)!=(yj>lat))&&(lng<(xj-xi)*(lat-yi)/(yj-yi)+xi))c=!c;}return c;}

function openSheet(no){const d=byNo[no];
 $('#shNum').textContent='#'+no;$('#shArea').textContent=d.a;$('#shSec').textContent=d.g;
 $('#shKv').innerHTML='<span class="k">Group: <b>'+esc(d.g)+'</b></span><span class="k">S.No: <b>'+no+'</b></span>'+(d.owner?'<span class="k">Owner: <b>'+esc(d.owner)+'</b>'+(d.emp?' ('+esc(d.emp)+')':'')+'</span>':'')+(d.poly?'<span class="k">Boundary: <b>mapped</b></span>':'');
 const st=$('#shStatus');const cls=d.approx?'pend':'ok';
 st.className='status '+cls;
 st.innerHTML='<div><div>'+(d.approx?'Approximate (layout-derived)':'Mapped polygon &mdash; precise')+'</div><div class="coords">'+d.lat.toFixed(6)+', '+d.lng.toFixed(6)+'</div></div>';
 const g='https://www.google.com/maps/search/?api=1&query='+d.lat+','+d.lng;
 const gd='https://www.google.com/maps/dir/?api=1&destination='+d.lat+','+d.lng;
 $('#shActs').innerHTML='<a class="btn go" href="'+gd+'" target="_blank" rel="noopener">&#129517; Directions</a><a class="btn sec" href="'+g+'" target="_blank" rel="noopener">&#128205; Open in Maps</a>';
 $('#shNote').textContent=d.poly?'Standing inside this boundary identifies this asset.':'';
 $('#sheet').classList.add('show');
 map.setView([d.lat,d.lng],Math.max(map.getZoom(),18));}
$('#shX').onclick=()=>$('#sheet').classList.remove('show');

const q=$('#q'),results=$('#results'),clr=$('#clr');
function doSearch(){const v=q.value.trim().toLowerCase();clr.hidden=!v;if(!v){results.hidden=true;return;}
 const hits=DATA.filter(d=>{const own=(d.owner||'').toLowerCase();return d.a.toLowerCase().includes(v)||d.g.toLowerCase().includes(v)||own.includes(v)||String(d.n)===v;}).slice(0,60);
 results.innerHTML=hits.map(d=>{const dot=d.approx?'pend':'ok';const sub=d.owner?esc(d.g)+' &middot; '+esc(d.owner):esc(d.g);
  return '<div class="ritem" data-no="'+d.n+'"><span class="rdot '+dot+'"></span><div class="rtext"><div class="a">'+esc(d.a)+'</div><div class="o">'+sub+'</div></div><span class="rnum">#'+d.n+'</span></div>';}).join('');
 results.hidden=false;
 results.querySelectorAll('.ritem').forEach(el=>el.onclick=()=>{const no=+el.dataset.no;results.hidden=true;q.blur();openSheet(no);});}
q.addEventListener('input',doSearch);clr.onclick=()=>{q.value='';doSearch();q.focus();};

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800);}
$('#hereBtn').onclick=()=>{if(!navigator.geolocation){toast('Geolocation not available');return;}
 toast('Locating…');navigator.geolocation.getCurrentPosition(pos=>{const me={lat:pos.coords.latitude,lng:pos.coords.longitude};
  if(meMarker)meMarker.remove();
  meMarker=L.marker([me.lat,me.lng],{icon:L.divIcon({className:'',html:'<div class="me-dot"></div>',iconSize:[18,18],iconAnchor:[9,9]}),zIndexOffset:1000}).addTo(map);
  map.setView([me.lat,me.lng],18);
  let inside=null;for(const d of DATA){if(d.poly&&pip(me.lat,me.lng,d.poly)){inside=d.n;break;}}
  if(inside){openSheet(inside);toast('You are in: '+byNo[inside].a+(byNo[inside].owner?' — '+byNo[inside].owner:''));}
  else{let best=null,bd=1e9;for(const d of DATA){const dd=(d.lat-me.lat)**2+(d.lng-me.lng)**2;if(dd<bd){bd=dd;best=d.n;}}
   if(best){openSheet(best);toast('Nearest asset: '+byNo[best].a);}}
 },err=>toast('Location error: '+err.message+' — allow location access.'),{enableHighAccuracy:true,timeout:15000,maximumAge:0});};

// PWA install
let deferred=null;const installBtn=$('#installBtn');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;installBtn.classList.add('show');});
installBtn.onclick=async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;installBtn.classList.remove('show');};
window.addEventListener('appinstalled',()=>installBtn.classList.remove('show'));
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js').catch(()=>{}));}
</script></body></html>
